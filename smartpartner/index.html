<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Smart Partner &mdash; Private Offer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#080808; --ink-2:#141110; --panel:#111111; --line:#232323;
  --text:#F2F0EC; --muted:#9A948C;
  --gold:#E8B33D; --gold-bright:#F5CB5C; --gold-soft:rgba(232,179,61,.14); --gold-line:rgba(232,179,61,.38);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--ink);color:var(--text);min-height:100vh}

#gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;
  background:radial-gradient(1100px 760px at 50% 18%, var(--ink-2) 0%, var(--ink) 62%);z-index:10}
.gate-card{width:100%;max-width:410px;background:var(--panel);border:1px solid var(--line);border-radius:20px;
  padding:44px 32px 34px;text-align:center;box-shadow:0 26px 80px rgba(0,0,0,.7), 0 0 0 1px rgba(217,164,65,.08)}
.gate-card img{height:52px;margin-bottom:24px}
.gate-kicker{font-size:11.5px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:9px}
.gate-title{font-size:21px;font-weight:400;color:var(--text);margin-bottom:26px;line-height:1.35}
.gate-row{display:flex;gap:10px}
.gate-row input{flex:1;min-width:0;padding:13px 16px;font:inherit;font-size:15px;border:1.5px solid var(--line);
  border-radius:12px;background:#0C0C0C;color:var(--text);outline:none;transition:border-color .15s}
.gate-row input::placeholder{color:#5E5A55}
.gate-row input:focus{border-color:var(--gold)}
.gate-row button{padding:13px 22px;font:inherit;font-size:15px;font-weight:500;color:#141110;background:var(--gold);
  border:0;border-radius:12px;cursor:pointer;transition:filter .15s}
.gate-row button:hover{filter:brightness(1.1)}
#gate-err{height:20px;margin-top:12px;font-size:13px;color:#E0625A;visibility:hidden}
.gate-foot{margin-top:26px;font-size:12px;color:var(--muted)}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}

#offer{display:none}
</style>
</head>
<body>

<div id="gate">
  <form class="gate-card" id="gate-form">
    <img src="logo.png" alt="Smart Partner">
    <div class="gate-kicker">Private &amp; Confidential</div>
    <div class="gate-title">An offer prepared for Smart Partner</div>
    <div class="gate-row">
      <input id="pw" type="password" placeholder="Access code" autocomplete="off" autofocus>
      <button type="submit">Open</button>
    </div>
    <div id="gate-err">Incorrect access code</div>
    <div class="gate-foot">Prepared by Adham Aly &middot; September 2026</div>
  </form>
</div>

<div id="offer"></div>

/* __SEALED__ end */
const b2a=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unseal(pw){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b2a(SALT),iterations:310000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b2a(IV)},key,b2a(CT));
  return new TextDecoder().decode(pt);
}
document.getElementById('gate-form').addEventListener('submit',async e=>{
  e.preventDefault();
  const card=e.target, err=document.getElementById('gate-err');
  try{
    const html=await unseal(document.getElementById('pw').value);
    const offer=document.getElementById('offer');
    offer.innerHTML=html;
    offer.querySelectorAll('script').forEach(s=>{const n=document.createElement('script');n.textContent=s.textContent;s.replaceWith(n);});
    offer.style.display='block';
    document.getElementById('gate').remove();
    document.body.style.background='var(--ink)';
  }catch(_){
    err.style.visibility='visible';
    card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
  }
});
</script>
