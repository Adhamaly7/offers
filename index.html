<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Vondera — Private Offer</title>
<style>
@font-face{font-family:'Saudia';src:url('fonts/saudia-Regular.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Saudia';src:url('fonts/saudia-Medium.woff2') format('woff2');font-weight:500;font-display:swap}
@font-face{font-family:'Saudia';src:url('fonts/saudia-SemiBold.woff2') format('woff2');font-weight:600;font-display:swap}
:root{
  --ink:#1B1023; --ink-2:#2A1145; --purple:#5900FF; --purple-soft:#E6DEF8;
  --lav:#F4EDFB; --lav-2:#ECE3F5; --text:#1B1023; --muted:#736784;
  --gold:#D9C669; --gold-soft:#FBF4D4; --white:#FBF8FF;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Saudia',system-ui,sans-serif;background:var(--ink);color:var(--text);min-height:100vh}

/* ---------- gate ---------- */
#gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;
  background:radial-gradient(1200px 800px at 50% 20%, var(--ink-2) 0%, var(--ink) 60%);z-index:10}
.gate-card{width:100%;max-width:400px;background:var(--white);border-radius:20px;padding:44px 32px 36px;
  text-align:center;box-shadow:0 24px 80px rgba(89,0,255,.25), 0 2px 8px rgba(0,0,0,.4)}
.gate-card img{height:44px;margin-bottom:22px}
.gate-kicker{font-size:12px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--purple);margin-bottom:8px}
.gate-title{font-size:22px;font-weight:600;color:var(--ink);margin-bottom:26px}
.gate-row{display:flex;gap:10px}
.gate-row input{flex:1;min-width:0;padding:13px 16px;font:inherit;font-size:15px;border:1.5px solid var(--lav-2);
  border-radius:12px;background:var(--lav);color:var(--ink);outline:none;transition:border-color .15s}
.gate-row input:focus{border-color:var(--purple)}
.gate-row button{padding:13px 22px;font:inherit;font-size:15px;font-weight:600;color:#fff;background:var(--purple);
  border:0;border-radius:12px;cursor:pointer;transition:filter .15s}
.gate-row button:hover{filter:brightness(1.12)}
#gate-err{height:20px;margin-top:12px;font-size:13px;color:#B3261E;visibility:hidden}
.gate-foot{margin-top:26px;font-size:12px;color:var(--muted)}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}

/* ---------- unlocked content mounts here ---------- */
#offer{display:none}
</style>
</head>
<body>

<div id="gate">
  <form class="gate-card" id="gate-form">
    <img src="logo.png" alt="Vondera">
    <div class="gate-kicker">Private &amp; Confidential</div>
    <div class="gate-title">An offer prepared for Vondera</div>
    <div class="gate-row">
      <input id="pw" type="password" placeholder="Access code" autocomplete="off" autofocus>
      <button type="submit">Open</button>
    </div>
    <div id="gate-err">Incorrect access code</div>
    <div class="gate-foot">Prepared by Adham Aly &middot; September 2026</div>
  </form>
</div>

<div id="offer"></div>

const b2a=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unseal(pw){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b2a(SALT),iterations:310000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b2a(IV)},key,b2a(CT));
  return new TextDecoder().decode(pt);
}

    const offer=document.getElementById('offer');
    offer.innerHTML=html;
    offer.querySelectorAll('script').forEach(s=>{const n=document.createElement('script');n.textContent=s.textContent;s.replaceWith(n);});
    offer.style.display='block';
    document.getElementById('gate').remove();
    document.body.style.background='var(--lav)';
  }catch(_){
    err.style.visibility='visible';
    card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
  }
});
</script>
</body>
</html>
